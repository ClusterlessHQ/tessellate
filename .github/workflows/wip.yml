name: Clusterless Wip Build
run-name: "Push: from ${{ github.actor }}"
on:
  push:
    branches:
      - 'wip-*'
    paths-ignore:
      - '**.txt'
      - '**.md'
      - '**.adoc'
jobs:
  # every wip-* branch (e.g. wip-1.0-modernize) runs the unit and integration tests
  test:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publish.outputs.publish }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # Gradle and its settings plugins (foojay 1.0.0) run on Java 17; the build
      # compiles and tests on the Java 25 toolchain, found through JAVA_HOME_25_X64;
      # 17 is listed last so it stays JAVA_HOME and the Gradle JVM
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Env
        run: echo "${{ vars.GRADLE_PROPERTIES }}" > gradle.properties

      # only the version branch (wip-<release.major>) publishes; it is the
      # same branch jreleaser releases from (release.github.branch in tessellate-main)
      - name: Resolve Publish Branch
        id: publish
        run: |
          major=$(sed -n 's/^release\.major=//p' version.properties)
          if [ "${GITHUB_REF_NAME}" = "wip-${major}" ]; then publish=true; else publish=false; fi
          echo "branch=${GITHUB_REF_NAME} release-branch=wip-${major} publish=${publish}"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Run Tests
        env:
          USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon --info --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 check

  # only the version branch releases, publishes the Homebrew and Docker images, and deploys docs
  release:
    needs: test
    if: needs.test.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # Gradle and its settings plugins (foojay 1.0.0) run on Java 17; the build
      # compiles and tests on the Java 25 toolchain, found through JAVA_HOME_25_X64;
      # 17 is listed last so it stays JAVA_HOME and the Gradle JVM
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Env
        run: echo "${{ vars.GRADLE_PROPERTIES }}" > gradle.properties

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Release and Publish
        env:
          USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_HOMEBREW_GITHUB_TOKEN: ${{ secrets.JRELEASER_HOMEBREW_GITHUB_TOKEN }}
          JRELEASER_DOCKER_GITHUB_TOKEN: ${{ secrets.JRELEASER_DOCKER_GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon --info --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 release

      - name: Trigger Netlify Doc Deploy
        run: |
          curl -X POST -d '{}' https://api.netlify.com/build_hooks/67fe72e7760e879248fa36c4

      - name: Archive Release Log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jreleaser-log
          path: |
            tessellate-main/build/jreleaser/trace.log
            tessellate-main/build/jreleaser/output.properties
